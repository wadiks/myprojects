apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: user-ingress
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  rules:
    - host: arch.homework
      http:
        paths:
          - path: /user/add
            pathType: Exact
            backend:
              service:
                name: user-service
                port:
                  number: 80
          - path: /user/get_all
            pathType: Exact
            backend:
              service:
                name: user-service
                port:
                  number: 80
          - path: /user/get
            pathType: Prefix
            backend:
              service:
                name: user-service
                port:
                  number: 80
          - path: /user/delete
            pathType: Prefix
            backend:
              service:
                name: user-service
                port:
                  number: 80
          - path: /user/edit
            pathType: Exact
            backend:
              service:
                name: user-service
                port:
                  number: 80